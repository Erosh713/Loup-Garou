<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1222">
<title>Loup-Garou</title>
<style>
:root{--bg:#0f1222;--card:#1a1e35;--line:#2b3052;--txt:#eef0ff;--mut:#9aa0c3;--acc:#e0b45a;--red:#e2574c;--green:#4fbf8a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);-webkit-tap-highlight-color:transparent;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0 2px}
h2{font-size:18px;margin:26px 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
button{font:inherit;color:var(--txt);background:#252a48;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
button.pri{background:var(--acc);color:#1b1407;border-color:var(--acc);font-weight:600}
button.sm{padding:6px 11px;font-size:14px}
button.full{width:100%}
button.danger{color:var(--red)}
input,select{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#11152b;color:var(--txt)}
select.sm{width:auto;padding:6px 8px;font-size:14px}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.dot{width:9px;height:9px;border-radius:50%;background:#555b80;flex:none}
.dot.on{background:var(--green)}
.grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dead .grow{opacity:.45;text-decoration:line-through}
.code{font-size:44px;letter-spacing:10px;font-weight:700;text-align:center;color:var(--acc);margin:4px 0}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
.note{background:#2a2440;border:1px solid #4a3f75;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.win{background:#20382c;border-color:#3f7a5c}
.status{background:#3a2a1c;border:1px solid #7a5a2a;border-radius:10px;padding:8px 12px;font-size:14px;margin:10px 0}
.steps{margin:0;padding-left:22px}
.steps li{padding:6px 0}
.reveal{min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer}
.reveal .s{display:none}
.reveal.show .s{display:block}
.reveal.show .h{display:none}
.big{font-size:72px;line-height:1.1}
.rname{font-size:28px;font-weight:700;margin:8px 0}
#qr{display:flex;justify-content:center;margin:12px 0}
#qr img,#qr canvas{background:#fff;padding:8px;border-radius:8px}
.tot{text-align:right;font-size:14px;margin-top:6px}
.bad{color:var(--red)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btns>button{flex:1}
button.i{padding:2px 9px;font-size:13px;border-radius:99px;color:var(--mut);flex:none}
.list li.info{display:block;font-size:14px;color:var(--mut);padding:0 0 12px 34px}
details summary{cursor:pointer}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://unpkg.com/mqtt@5.15.2/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const ROLES={
  loup:{n:"Loup-Garou",e:"🐺",d:"Chaque nuit, avec les autres loups, choisis une victime. Le jour, fais-toi passer pour un villageois."},
  voyante:{n:"Voyante",e:"🔮",d:"Chaque nuit, tu découvres le rôle d'un joueur."},
  sorciere:{n:"Sorcière",e:"🧪",d:"Tu as une potion de vie et une potion de mort, utilisables une seule fois chacune."},
  chasseur:{n:"Chasseur",e:"🏹",d:"Quand tu meurs, tu élimines immédiatement un joueur de ton choix."},
  cupidon:{n:"Cupidon",e:"💘",d:"La première nuit, tu désignes deux amoureux. Si l'un meurt, l'autre meurt de chagrin."},
  petitefille:{n:"Petite Fille",e:"👧",d:"La nuit, tu peux entrouvrir les yeux pour espionner les loups. Ne te fais pas prendre !"},
  salvateur:{n:"Salvateur",e:"🛡️",d:"Chaque nuit, tu protèges un joueur de l'attaque des loups. Jamais le même deux nuits de suite."},
  ancien:{n:"Ancien",e:"🧓",d:"Tu survis à la première attaque des loups. Mais si le village t'élimine, tous les villageois perdent leurs pouvoirs."},
  idiot:{n:"Idiot du village",e:"🤪",d:"Si le village vote contre toi, ton rôle est révélé et tu restes en vie, mais tu ne votes plus."},
  corbeau:{n:"Corbeau",e:"🐦",d:"Chaque nuit, tu peux désigner un joueur : il aura 2 voix contre lui au prochain vote."},
  villageois:{n:"Villageois",e:"🧑‍🌾",d:"Pas de pouvoir : trouve les loups et vote bien."}
};
const ORDER=["loup","voyante","sorciere","chasseur","cupidon","petitefille","salvateur","ancien","idiot","corbeau","villageois"];
const MAIRE={n:"Maire",e:"🎖️",d:"Élu par le village le premier jour. Sa voix compte double, il tranche les égalités, et à sa mort il désigne son successeur."};
let infoOpen=null;
const ibtn=k=>`<button class="sm i" data-a="info" data-k="${esc(k)}" aria-label="À quoi sert ce rôle ?">ⓘ</button>`;
const iline=(k,txt)=>infoOpen===k?`<li class="info">${txt}</li>`:"";
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const newTimer=d=>({dur:d||180000,left:d||180000,running:false,endsAt:0});
const BROKERS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081/mqtt"];
const TOPIC=code=>"lgthiercelieux/v2/"+code;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=buf=>{const a=new Uint8Array(buf);let s="";for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ECDH={name:"ECDH",namedCurve:"P-256"};
const genKeys=()=>crypto.subtle.generateKey(ECDH,true,["deriveKey"]);
const exportPub=async k=>b64(await crypto.subtle.exportKey("raw",k.publicKey));
async function derive(priv,pubB64){const pub=await crypto.subtle.importKey("raw",unb64(pubB64),ECDH,false,[]);return crypto.subtle.deriveKey({name:"ECDH",public:pub},priv,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(obj)));return {iv:b64(iv),ct:b64(ct)}}
async function unseal(key,box){return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)},key,unb64(box.ct))))}
const app=document.getElementById("app");
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const unstore=k=>{try{localStorage.removeItem(k)}catch(e){}};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const total=c=>ORDER.reduce((s,k)=>s+(c[k]||0),0);
const baseUrl=()=>location.href.split(/[?#]/)[0];
const joinUrl=code=>baseUrl()+"?p="+code;
function newCode(){const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function suggest(n){
  const c={};ORDER.forEach(k=>c[k]=0);
  if(n<1)return c;
  c.loup=n<=5?1:n<=11?2:n<=17?3:4;
  let left=n-c.loup;
  for(const [k,min] of [["voyante",4],["sorciere",6],["chasseur",7],["cupidon",8],["petitefille",10],["salvateur",12],["corbeau",14],["ancien",16]]){
    if(n>=min&&left>0){c[k]=1;left--}
  }
  c.villageois=Math.max(0,left);
  return c;
}

let nets=[],timer=null,pingT=null;
function schedule(fn,ms){clearTimeout(timer);timer=setTimeout(fn,ms)}
function killPeer(){clearTimeout(timer);clearInterval(pingT);pingT=null;nets.forEach(c=>{try{c.end(true)}catch(e){}});nets=[]}
function mq(url,onConnect,onMsg,onState){
  const c=mqtt.connect(url,{clientId:"lg"+rid().slice(0,14),clean:true,reconnectPeriod:2000,connectTimeout:8000,keepalive:20,protocolVersion:4});
  c.on("connect",()=>onConnect(c));
  c.on("message",(t,pl)=>onMsg(t,typeof pl==="string"?pl:dec.decode(pl)));
  ["offline","close","reconnect"].forEach(e=>c.on(e,()=>onState()));
  c.on("error",()=>{});
  return c;
}

const actions={};
actions.info=d=>{infoOpen=infoOpen===d.k?null:d.k;if(H)renderHost();else if(P)renderPlayer()};
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const f=actions[b.dataset.a];if(f)f(b.dataset,b);
});
app.addEventListener("change",e=>{
  const s=e.target.closest("select[data-pending]");
  if(s&&H)pending[s.dataset.pending]=s.value;
});

function home(msg){
  H=null;P=null;
  const h=load("lg-host");
  app.innerHTML=`
  <h1>🐺 Loup-Garou</h1>
  <p class="mut">Le meneur crée la partie, les joueurs la rejoignent sur leur téléphone avec le code.</p>
  ${h?`<div class="card"><p style="margin-top:0">Partie en cours : <b>${esc(h.code)}</b> (${h.players.length} joueurs)</p><button class="pri full" data-a="resume">Reprendre comme meneur</button></div>`:""}
  <div class="card"><button class="${h?"":"pri "}full" data-a="create">Créer une nouvelle partie (meneur)</button></div>
  <div class="card">
    <p style="margin-top:0">Rejoindre une partie</p>
    <input id="code" placeholder="Code à 4 caractères" maxlength="4" autocapitalize="characters" autocomplete="off">
    <div style="height:10px"></div>
    <button class="full" data-a="joincode">Rejoindre</button>
    <div class="err" id="err">${msg?esc(msg):""}</div>
  </div>`;
}
actions.create=()=>{const h=load("lg-host");if(h&&!confirm("Remplacer la partie en cours ?"))return;unstore("lg-host");startHost(null)};
actions.resume=()=>startHost(load("lg-host"));
actions.joincode=()=>{
  const c=($("#code").value||"").trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(c)){$("#err").textContent="Entre le code à 4 caractères donné par le meneur.";return}
  joinScreen(c,false);
};

/* ---------------- MENEUR ---------------- */
let H=null,conns={},pending={},hostStatus="",hostErr="",hostNote="";
function startHost(restore){
  P=null;
  H=restore||{code:newCode(),phase:"lobby",players:[],comp:suggest(0),custom:false,night:0};
  H.showQR=H.phase==="lobby";
  H.timer=H.timer||newTimer();H.vote=H.vote||null;
  conns={};pending={};hostErr="";hostNote="";
  history.replaceState(null,"",baseUrl());
  openHostNet();
  renderHost();
}
function saveHost(){if(!H)return;const {showQR,preview,...rest}=H;store("lg-host",rest)}
let hostKeys=null,hostPub="",hostSess="",peerKeys={},hostEver=false,seq=0;
async function openHostNet(){
  killPeer();
  hostStatus="Connexion au serveur…";hostEver=false;peerKeys={};
  const me=H;
  hostKeys=await genKeys();hostPub=await exportPub(hostKeys);hostSess=rid();
  if(H!==me)return;
  const T=TOPIC(H.code);
  const onState=()=>{if(H!==me)return;const st=nets.some(c=>c.connected)?"":hostEver?"Connexion perdue, reconnexion…":"Connexion au serveur…";if(st!==hostStatus){hostStatus=st;renderHost()}};
  nets=BROKERS.map(u=>mq(u,c=>{
    if(H!==me)return;
    hostEver=true;
    c.subscribe(T+"/in",{qos:1});
    c.publish(T+"/host",JSON.stringify({pub:hostPub,s:hostSess}),{qos:1,retain:true});
    onState();saveHost();
  },(t,txt)=>onHostRaw(me,txt),onState));
}
async function onHostRaw(me,txt){
  if(!H||H!==me||!txt)return;
  let m;try{m=JSON.parse(txt)}catch(e){return}
  if(!m||typeof m.pid!=="string"||m.pid.length>40||typeof m.pub!=="string"||m.pub.length>200)return;
  let k=peerKeys[m.pid];
  if(!k||k.pub!==m.pub){k={pub:m.pub,key:derive(hostKeys.privateKey,m.pub)};peerKeys[m.pid]=k}
  let msg;try{msg=await unseal(await k.key,m)}catch(e){return}
  if(H!==me||!msg||typeof msg!=="object"||typeof msg.id!=="string"||msg.id.length>=64)return;
  if(msg.t==="hello"){
    let name=String(msg.name||"").trim().slice(0,20)||"Joueur";
    let p=H.players.find(x=>x.id===msg.id);
    const taken=n=>H.players.some(x=>x.id!==msg.id&&x.name.toLowerCase()===n.toLowerCase());
    if(taken(name)){let i=2;while(taken(name+" "+i))i++;name=name+" "+i}
    if(!p){p={id:msg.id,name,role:null,alive:true,lover:false};H.players.push(p)}
    else p.name=name;
    conns[msg.id]={pid:m.pid,key:k.key,seen:Date.now()};
    changed();return;
  }
  const c=conns[msg.id];if(!c||c.pid!==m.pid)return;
  const was=online(msg.id);c.seen=Date.now();
  if(msg.t==="ping"){if(!was)renderHost();return}
  playerAct(msg.id,msg);
}
function playerAct(id,m){
  if(m.t==="vote")castVote(id,m.target);
  if(m.t==="tiebreak"&&id===H.mayor&&mayorAlive()){const tie=tieLeaders();if(tie&&tie.includes(m.name)){H.vote.tieChoice=m.name;changed()}}
  if(m.t==="succ"&&H.succ&&id===H.mayor&&inPlay().some(x=>x.name===m.name))setMayor(m.name);
}
function mayorAlive(){return !!(H.mayor&&!H.succ&&H.players.some(p=>p.id===H.mayor&&p.alive))}
const isMayor=p=>H.mayor===p.id&&!H.succ;
const mtag=p=>isMayor(p)?" 🎖️":"";
function setMayor(name){const p=H.players.find(x=>x.name===name&&x.alive);if(!p)return;H.mayor=p.id;H.succ=false;hostNote="🎖️ "+p.name+" est le nouveau Maire.";if(H.vote&&H.vote.kind==="mayor")H.vote=null;changed()}
function voteOptions(p){return H.vote&&H.vote.kind==="mayor"?inPlay():inPlay().filter(x=>x.id!==p.id)}
function tieLeaders(){const v=H.vote;if(!v||v.open||v.kind==="mayor")return null;const r=tally();if(r.length<2||r[0].n!==r[1].n)return null;return r.filter(x=>x.n===r[0].n).map(x=>x.name)}
function online(id){const c=conns[id];return !!(c&&Date.now()-c.seen<35000)}
const inPlay=()=>H.players.filter(p=>p.role&&p.alive);
const canVote=p=>p.role&&p.alive&&!p.revealed;
function castVote(voterId,target){
  const v=H.vote,p=H.players.find(x=>x.id===voterId);
  if(!v||!v.open||!p||!canVote(p)||typeof target!=="string")return;
  if(!voteOptions(p).some(x=>x.name===target))return;
  v.votes[voterId]=target;changed();
}
function tally(){
  const v=H.vote,t={};
  const elim=v.kind!=="mayor";
  Object.entries(v.votes).forEach(([id,n])=>t[n]=(t[n]||0)+(elim&&id===H.mayor&&mayorAlive()?2:1));
  if(elim&&v.crow&&inPlay().some(x=>x.name===v.crow))t[v.crow]=(t[v.crow]||0)+2;
  return Object.entries(t).map(([name,n])=>({name,n,crow:name===v.crow})).sort((a,b)=>b.n-a.n);
}
function timerLeft(){const t=H.timer;return t.running?Math.max(0,t.endsAt-Date.now()):t.left}
function stateFor(p){
  const inGame=H.phase==="game"&&p.role;
  const v=H.vote;
  return {t:"state",phase:H.phase,count:H.players.length,name:p.name,
    role:inGame?p.role:null,alive:p.alive,revealed:!!p.revealed,
    lover:inGame&&p.lover?H.players.filter(x=>x.lover&&x.id!==p.id).map(x=>x.name):[],
    mates:inGame&&p.role==="loup"?H.players.filter(x=>x.role==="loup"&&x.id!==p.id).map(x=>x.name):[],
    timer:H.phase==="game"?{running:H.timer.running,remaining:timerLeft(),dur:H.timer.dur}:null,
    mayor:inGame&&H.mayor&&!H.succ?(H.players.find(x=>x.id===H.mayor)||{}).name||null:null,isMayor:!!(inGame&&isMayor(p)),
    succ:inGame&&H.succ&&H.mayor===p.id?inPlay().filter(x=>x.id!==p.id).map(x=>x.name):null,
    tie:inGame&&p.id===H.mayor&&mayorAlive()?tieLeaders():null,
    roles:inGame?[...new Set(H.players.filter(x=>x.role).map(x=>x.role))]:[],
    vote:inGame&&v?{kind:v.kind||"elim",tieChoice:v.tieChoice||null,open:v.open,options:v.open?voteOptions(p).map(x=>x.name):[],
      mine:v.votes[p.id]||null,canVote:canVote(p),count:Object.keys(v.votes).length,
      total:H.players.filter(canVote).length,results:v.open?null:tally()}:null};
}
async function sendTo(id,msg){
  const c=conns[id];if(!c||!H)return;
  const T=TOPIC(H.code)+"/out/"+c.pid,targets=nets.slice();
  msg.q=++seq;msg.s=hostSess;
  try{const pl=JSON.stringify(await seal(await c.key,msg));targets.forEach(n=>{if(n.connected)n.publish(T,pl,{qos:1})})}catch(e){}
}
function broadcast(){H.players.forEach(p=>sendTo(p.id,stateFor(p)))}
function changed(){
  if(!H)return;
  if(!H.custom)H.comp=suggest(H.players.length);
  saveHost();renderHost();broadcast();
}

function renderHost(){
  if(!H)return;
  const n=H.players.length,url=joinUrl(H.code);
  let h=`<h1>🌙 Meneur</h1>
  ${hostStatus?`<div class="status">${esc(hostStatus)}</div>`:""}
  <div class="card" style="text-align:center">
    <div class="mut">Code de la partie</div>
    <div class="code">${esc(H.code)}</div>
    <div class="mut" style="word-break:break-all">${esc(url)}</div>
    ${H.showQR?`<div id="qr"></div>`:""}
    <div class="btns"><button class="sm" data-a="share">Partager le lien</button><button class="sm" data-a="qr">${H.showQR?"Masquer":"Afficher"} le QR code</button></div>
  </div>`;
  const pv=H.preview&&H.players.find(p=>p.id===H.preview);
  if(pv)h+=`<div class="card" style="border-color:var(--acc)">
    <div style="display:flex;align-items:center;gap:10px"><b class="grow">👁 Écran de ${esc(pv.name)}</b><button class="sm" data-a="unpeek">Fermer</button></div>
    <p class="mut" style="margin:4px 0 0">Aperçu de ce que voit ce joueur sur son téléphone.</p>
    ${playerBody(stateFor(pv))}</div>`;

  if(H.phase==="lobby"){
    const c=H.comp,t=total(c);
    h+=`<h2>Joueurs (${n})</h2><div class="card">${n?`<ul class="list">${H.players.map(p=>`
      <li>${dot(p)}<span class="grow">${esc(p.name)}</span>
      <button class="sm" data-a="peek" data-id="${esc(p.id)}" aria-label="Voir son écran">👁</button>
      <button class="sm danger" data-a="kick" data-id="${esc(p.id)}" aria-label="Retirer">✕</button></li>`).join("")}</ul>`
      :`<p class="mut" style="margin:0">Les joueurs apparaissent ici dès qu'ils rejoignent avec le code ou le QR code.</p>`}
      <div class="btns"><button class="sm" data-a="bot">🤖 Ajouter un joueur test</button>${H.players.some(p=>p.bot)?`<button class="sm danger" data-a="nobots">Retirer les tests</button>`:""}</div></div>
    <h2>Composition</h2><div class="card"><ul class="list">${ORDER.map(k=>`
      <li><span style="font-size:22px">${ROLES[k].e}</span><span class="grow">${ROLES[k].n}</span>${ibtn(k)}
      <button class="sm" data-a="dec" data-k="${k}" aria-label="Moins">−</button>
      <b style="width:26px;text-align:center">${c[k]||0}</b>
      <button class="sm" data-a="inc" data-k="${k}" aria-label="Plus">+</button></li>${iline(k,ROLES[k].d)}`).join("")}
      <li><span style="font-size:22px">${MAIRE.e}</span><span class="grow">Maire <span class="mut">(élu en jeu)</span></span>${ibtn("maire")}</li>${iline("maire",MAIRE.d)}</ul>
      <div class="tot ${t!==n?"bad":""}">${t} rôle(s) pour ${n} joueur(s)</div>
      ${H.custom?`<div class="btns"><button class="sm" data-a="auto">Revenir à la composition conseillée</button></div>`:`<div class="mut" style="margin-top:6px">Composition conseillée, elle s'adapte quand des joueurs arrivent.</div>`}
    </div>
    <button class="pri full" data-a="deal">Distribuer les rôles</button>
    <div class="err">${esc(hostErr)}</div>`;

async function startPlayer(code,name){
  killPeer();
  const saved=load("lg-player")||{};
  const id=saved.id||rid();
  store("lg-player",{id,name,code});
  history.replaceState(null,"",baseUrl()+"?p="+code);
  const me={code,name,id,state:null,status:"Étape 1/2 : connexion au serveur…",over:"",t0:Date.now(),pid:rid(),key:null,hostPub:"",lastQ:0,sess:""};
  P=me;renderPlayer();
  me.keys=await genKeys();me.pub=await exportPub(me.keys);
  if(P!==me)return;
  const T=TOPIC(code);let chosen=null;
  const onState=()=>{if(P!==me||me.over)return;if(!nets.some(c=>c.connected)&&me.state&&!me.status){me.status="Connexion perdue, reconnexion…";me.t0=Date.now();renderPlayer()}};
  nets=BROKERS.map(u=>mq(u,c=>{
    if(P!==me)return;
    if(!chosen){chosen=c;nets.filter(x=>x!==c).forEach(x=>{try{x.end(true)}catch(e){}});nets=[c]}
    if(c!==chosen)return;
    c.subscribe([T+"/host",T+"/out/"+me.pid],{qos:1});
    if(!me.state){me.status="Étape 2/2 : recherche de la partie…";renderPlayer()}
    clearTimeout(me.lostT);
    me.lostT=setTimeout(()=>{if(P===me&&!me.state&&!me.over){me.status="Partie introuvable pour l'instant. Vérifie le code et que le meneur a l'app ouverte. J'attends…";renderPlayer()}},8000);
    if(me.key)pHello();
  },(t,txt)=>onPlayerRaw(me,t,txt),onState));
  clearInterval(pingT);pingT=setInterval(()=>{if(P===me&&me.key)pSendRaw({t:"ping"})},10000);
}
async function onPlayerRaw(me,t,txt){
  if(P!==me||me.over)return;
  const T=TOPIC(me.code);
  if(t===T+"/host"){
    if(!txt)return;
    let h;try{h=JSON.parse(txt)}catch(e){return}
    if(!h||typeof h.pub!=="string")return;
    if(h.pub!==me.hostPub){me.hostPub=h.pub;me.key=derive(me.keys.privateKey,h.pub)}
    pHello();return;
  }
  if(!me.key)return;
  let m;try{m=await unseal(await me.key,JSON.parse(txt))}catch(e){return}
  if(P!==me||!m)return;
  if(m.s!==me.sess){me.sess=m.s;me.lastQ=0}
  if(m.q<=me.lastQ)return;me.lastQ=m.q;
  if(m.t==="state"){clearTimeout(me.lostT);m._recv=Date.now();me.state=m;me.name=m.name;me.status="";me.t0=0;renderPlayer()}
  else if(m.t==="kicked"){me.over="Le meneur t'a retiré de la partie.";killPeer();renderPlayer()}
  else if(m.t==="ended"){me.over="La partie est terminée. Merci d'avoir joué !";killPeer();renderPlayer()}
}
function pHello(){pSendRaw({t:"hello",name:P.name})}
async function pSendRaw(m){
  const me=P;if(!me||!me.key)return;
  const c=nets.find(x=>x.connected);if(!c)return;
  try{const box=await seal(await me.key,{...m,id:me.id});box.pid=me.pid;box.pub=me.pub;c.publish(TOPIC(me.code)+"/in",JSON.stringify(box),{qos:1})}catch(e){}
}
function playerBody(s){
  if(!s.role)return `<div class="card"><p style="margin-top:0">Tu es dans la partie 👋</p><p class="mut" style="margin-bottom:0">${s.phase==="lobby"?"Attends que le meneur distribue les rôles.":"La partie a déjà commencé : le meneur va te donner un rôle."} ${s.count} joueur${s.count>1?"s":""} dans la partie.</p></div>`;
  const r=ROLES[s.role],t=s.timer,v=s.vote;
  let day="";
  if(t&&(t.running||t.remaining<t.dur)){
    const end=t.running?(s._recv||Date.now())+t.remaining:"";
    day+=`<div class="card" style="text-align:center"><div class="mut">⏱ Débat du jour${t.running?"":t.remaining>0?" (en pause)":""}</div>
      <div class="code ${!t.running&&t.remaining<=0?"bad":""}" data-end="${end}">${t.remaining>0?fmt(t.remaining):"Temps écoulé"}</div></div>`;
  }
  if(v&&v.open){
    if(v.canVote)day+=`<div class="card"><p style="margin-top:0"><b>${v.kind==="mayor"?"🎖️ Élection du Maire":"🗳 Le village vote"}</b><br><span class="mut">Ton vote est anonyme. Tu peux changer d'avis jusqu'à la fin du vote.</span></p>
      <ul class="list">${v.options.map(n=>`<li><button class="full ${v.mine===n?"pri":""}" data-a="vote" data-name="${esc(n)}">${v.mine===n?"✓ ":""}${esc(n)}${n===s.name?" (toi)":""}${n===s.mayor&&v.kind!=="mayor"?" 🎖️":""}</button></li>`).join("")}</ul>
      <p class="mut" style="margin-bottom:0">${v.mine?"Vote enregistré. ":""}${v.count} / ${v.total} ont voté.</p></div>`;
    else day+=`<div class="card"><b>${v.kind==="mayor"?"🎖️ Élection du Maire":"🗳 Le village vote"}</b><p class="mut" style="margin-bottom:0">${s.alive?"Ton rôle a été révélé : tu ne votes plus.":"Les morts ne votent pas."} ${v.count} / ${v.total} ont voté.</p></div>`;
  } else if(v&&v.results){
    day+=`<div class="card"><b>${v.kind==="mayor"?"🎖️ Résultat de l'élection":"🗳 Résultat du vote"}</b>${v.results.length?`<ul class="list">${v.results.map(x=>`<li><span class="grow">${esc(x.name)}${x.crow?" 🐦":""}</span><b>${x.n} voix</b></li>`).join("")}</ul>`:`<p class="mut">Personne n'a voté.</p>`}</div>`;
  }
  if(s.tie)day+=`<div class="card" style="border-color:var(--acc)"><b>🎖️ Égalité : c'est toi qui tranches</b><p class="mut">En tant que Maire, choisis qui est éliminé.</p>
    <div class="btns">${s.tie.map(n=>`<button class="${v&&v.tieChoice===n?"pri":""}" data-a="tiebreak" data-name="${esc(n)}">${v&&v.tieChoice===n?"✓ ":""}${esc(n)}</button>`).join("")}</div></div>`;
  if(s.succ)day=`<div class="card" style="border-color:var(--acc)"><b>🎖️ Désigne ton successeur</b><p class="mut">Tu étais Maire : choisis qui reprend ton titre.</p>
    <div class="btns">${s.succ.map(n=>`<button data-a="succ" data-name="${esc(n)}">${esc(n)}</button>`).join("")}</div></div>`+day;
  if(s.mayor&&!s.isMayor)day=`<p class="mut" style="margin:0 0 4px">🎖️ Maire : <b>${esc(s.mayor)}</b></p>`+day;
  const rolesInfo=s.roles&&s.roles.length?`<details class="card"><summary><b>📖 Rôles de cette partie</b></summary><ul class="list" style="margin-top:8px">${[...s.roles.map(k=>ROLES[k]),MAIRE].map(x=>`<li style="display:block"><b>${x.e} ${x.n}</b><br><span class="mut">${x.d}</span></li>`).join("")}</ul></details>`:"";
  return `${s.alive?"":`<div class="note">☠️ Tu es mort. Garde le silence jusqu'à la fin de la partie !</div>`}
    ${s.revealed?`<div class="note">🤪 Ton rôle d'Idiot du village a été révélé : tu restes en vie mais tu ne votes plus.</div>`:""}
    ${s.isMayor?`<div class="note">🎖️ Tu es le Maire : ta voix compte double et tu tranches les égalités.</div>`:""}
    ${day}
    <div class="card reveal" id="rv">
      <div class="h"><div class="big">🂠</div><p style="font-size:18px;margin:10px 0 4px">Maintiens appuyé pour voir ton rôle</p><p class="mut" style="margin:0">Cache bien ton écran.</p></div>
      <div class="s"><div class="big">${r.e}</div><div class="rname">${r.n}</div><p class="mut" style="margin:0 8px">${r.d}</p>
        ${s.mates&&s.mates.length?`<p style="margin:12px 0 0">Les autres loups : <b>${s.mates.map(esc).join(", ")}</b></p>`:""}
        ${s.lover&&s.lover.length?`<p style="margin:12px 0 0">💘 Tu es amoureux de <b>${s.lover.map(esc).join(", ")}</b>. Si l'un de vous meurt, l'autre aussi.</p>`:""}
      </div>
    </div>${rolesInfo}`;
}
function attachReveal(){
  const rv=$("#rv");
  if(rv){
    const on=e=>{e.preventDefault();rv.classList.add("show")},off=()=>rv.classList.remove("show");
    rv.addEventListener("pointerdown",on);
    ["pointerup","pointercancel","pointerleave"].forEach(t=>rv.addEventListener(t,off));
    rv.addEventListener("contextmenu",e=>e.preventDefault());
  }
}
function renderPlayer(){
  if(!P)return;
  const s=P.state;let body="";
  if(P.over)body=`<div class="card">${esc(P.over)}</div>`;
  else if(!s)body=`<div class="card mut">${esc(P.status||"Connexion…")} <span data-since="${P.t0||""}"></span></div>`;
  else body=playerBody(s);
  app.innerHTML=`<h1>🐺 ${esc(P.name)}</h1><p class="mut">Partie ${esc(P.code)}</p>
  ${P.status&&s&&!P.over?`<div class="status">${esc(P.status)}</div>`:""}
  ${body}
  <p style="margin-top:24px"><button class="sm" data-a="leave">${P.over?"← Accueil":"Quitter la partie"}</button></p>`;
  attachReveal();
}
actions.leave=()=>{
  if(P&&!P.over&&!confirm("Quitter la partie ?"))return;
  const s=load("lg-player");if(s){delete s.code;store("lg-player",s)}
  killPeer();history.replaceState(null,"",baseUrl());home();
};

document.addEventListener("visibilitychange",()=>{
  if(document.hidden)return;
  nets.forEach(c=>{if(!c.connected){try{c.reconnect()}catch(e){}}});
  if(P&&P.key&&!P.over)pHello();
});
let onlineSig="";
setInterval(()=>{if(!H)return;const sig=H.players.map(p=>online(p.id)?1:0).join("");if(sig!==onlineSig){onlineSig=sig;renderHost()}},5000);

(function boot(){
  if(!window.mqtt||!window.crypto||!crypto.subtle){app.innerHTML=`<h1>🐺 Loup-Garou</h1><div class="card">Impossible de charger le module de connexion. Vérifie ta connexion Internet puis recharge la page.</div>`;return}
  const code=(new URLSearchParams(location.search).get("p")||"").toUpperCase();
  if(/^[A-Z0-9]{4}$/.test(code))joinScreen(code,true);else home();
})();
</script>
